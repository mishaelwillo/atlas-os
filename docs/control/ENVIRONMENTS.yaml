schema_version: 1
environments:
  production:
    github:
      repository: mishaelwillo/atlas-os
      branch: main
    supabase:
      project_ref: yyyspvralawnvhtmuyvg
      expected_migration: 0011_deployment_withdrawal_verdict
      required_tables:
        - spaces
        - api_tokens
        - runs
        - run_logs
        - approvals
        - audit_log
        - schedules
        - memory_cards
        - ingest_queue
        - memory_nodes
        - memory_edges
        - answer_cache
        - playbooks
        - sites
        - leads
        - conversations
        - messages
        - bench_results
        - site_deployments
        - qualification_assessments
        - demo_queue
        - outreach_sequences
        - outreach_touches
        - offers
        - deal_decisions
        - hosting_entitlements
    railway:
      api:
        public_url: https://api-production-78a5.up.railway.app
        health_path: /healthz
      os:
        public_url: https://os-production-8faf.up.railway.app
        health_path: /build-info.json
    # Published customer sites are hosted separately from Atlas itself. These
    # are identifiers and addresses only; the credential is a variable name
    # below, and the collector reports only whether it is set.
    hosting:
      provider: cloudflare-pages
      account_id: fd486ea72e20f31937e059f3d14ff0c2
      pages_project: atlas-sites
      provider_url: https://atlas-sites-2np.pages.dev
      public_base_url: https://sites.andtronai.com
      zone: andtronai.com
      layout: path
      required_variable_names:
        - CLOUDFLARE_ACCOUNT_ID
        - CLOUDFLARE_API_TOKEN
        - CLOUDFLARE_PAGES_PROJECT
        - ATLAS_SITES_BASE_URL
    required_variable_names:
      - DATABASE_URL
      - SUPABASE_URL
      - SUPABASE_SERVICE_ROLE_KEY
      - OS_APP_ORIGIN
      - VITE_API_URL
      - VITE_SUPABASE_URL
      - VITE_SUPABASE_ANON_KEY
