  - id: video-qy0l1t7x6le-presenter-pricing
    source_id: video-qy0l1t7x6le
    observed_at: "00:12:37-00:38:58"
    kind: claim
    observation: >-
      Presenter-reported offer figures include USD 100 or USD 119 plus tax
      monthly hosting, USD 2,000 website/SEO/reputation offers, a USD 300–2,500
      monthly social-posting range, USD 1,000 monthly email marketing, USD 50 basic edits,
      USD 100 complex edits, and a caption-rendered USD 9.97 monthly AI-search
      figure. None is an approved Atlas price.
    confidence: high
    verification: presenter_reported
    conflict_note: >-
      These are first-party sales claims inside an affiliate and training pitch.
      No customer sample, cost model, regional comparison, tax analysis, or
      independent market validation is supplied; the 9.97 caption rendering
      especially requires audio and offer-page verification.
    atlas_interpretation: >-
      Store each figure only as an unvalidated research input. Regional market
      research, cost-to-serve, terms, taxes, and measured willingness to pay
      must precede any Atlas pricing decision.
    capability_ids:
      - factory.deploy_site
      - seo.audit
      - reputation.manage
      - marketing.social
      - marketing.email
      - aeo.audit
    specification: docs/specs/p2/revenue-pilot.md
    artifacts:
      - type: transcript
