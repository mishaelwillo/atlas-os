name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Atlas control plane
        run: pnpm control:verify

      - name: Lint
        run: pnpm run lint

      - name: Build Workspace
        run: pnpm run build

      - name: Verify capability catalog
        run: |
          pnpm --filter @atlas/registry catalog
          git ls-files --error-unmatch docs/control/generated/capability-catalog.md
          git diff --exit-code -- docs/control/generated/capability-catalog.md

      - name: Verify generated files are committed
        run: git diff --exit-code -- apps/api/src/routes.gen.ts packages/client/src/client.gen.ts

      - name: Run Tests
        run: pnpm run test
